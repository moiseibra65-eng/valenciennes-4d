name: Generate Blender GLB
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/blender/**'
      - 'data/demo/**'
      - 'data/valenciennes/**'
      - '.github/workflows/blender-build.yml'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Inspect input files
        run: |
          pwd
          ls -lah scripts/blender data/demo
          python3 -m json.tool data/demo/buildings.geojson > /dev/null
      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy
          # Ubuntu's Blender uses the distro Python modules; NumPy is needed by glTF export.
          blender --version
          blender --background --factory-startup --python-exit-code 1 --python-expr "import numpy; print('Blender NumPy:', numpy.__version__)"
      - name: Generate model
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          mkdir -p exports
          if test -s data/valenciennes/place_armes_buildings_local.geojson; then
            INPUT=data/valenciennes/place_armes_buildings_local.geojson
            OUTPUT=exports/place_armes_buildings.glb
          else
            INPUT=data/demo/buildings.geojson
            OUTPUT=exports/valenciennes_demo.glb
          fi
          echo "Model source: $INPUT"
          blender --background --factory-startup --python-exit-code 1 --python scripts/blender/generate.py -- "$INPUT" "$OUTPUT"
      - name: Verify GLB export
        run: |
          ls -lh exports/*.glb
          test -n "$(find exports -name '*.glb' -size +0c -print -quit)"
          python3 - <<'PY'
          import struct
          from glob import glob
          with open(glob("exports/*.glb")[0], "rb") as f:
              header=f.read(12)
          assert len(header)==12 and header[:4]==b"glTF", "Invalid GLB header"
          print("GLB verified:",struct.unpack("<II",header[4:]))
          PY
      - name: Upload GLB artifact
        uses: actions/upload-artifact@v4
        with:
          name: valenciennes-buildings-glb
          path: exports/*.glb
          if-no-files-found: error
