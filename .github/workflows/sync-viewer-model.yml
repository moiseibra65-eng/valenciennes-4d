name: Synchroniser GLB pour la visionneuse
on:
  push:
    paths:
      - 'index.html'
      - '.github/workflows/sync-viewer-model.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Télécharger le dernier modèle Blender réussi
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p assets
          RUN_ID="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow blender-build.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          test -n "$RUN_ID" && test "$RUN_ID" != null
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name valenciennes-buildings-glb --dir assets
          test -s assets/place_armes_buildings.glb
          python3 - <<'PY'
          from pathlib import Path
          import struct
          p=Path("assets/place_armes_buildings.glb")
          data=p.read_bytes()
          assert data[:4]==b"glTF" and struct.unpack_from("<I",data,8)[0]==len(data)
          print("GLB valide:",len(data),"octets")
          PY
      - name: Enregistrer le modèle dans le dépôt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/place_armes_buildings.glb
          if ! git diff --cached --quiet; then
            git commit -m "Publier le GLB pour la visionneuse Valenciennes 4D"
            git push
          fi
