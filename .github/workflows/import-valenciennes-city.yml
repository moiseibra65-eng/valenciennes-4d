name: Import Valenciennes commune OSM buildings
on:
  workflow_dispatch:
  schedule:
    - cron: '20 4 1 * *'
permissions:
  contents: write
jobs:
  import-city:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'requests>=2.31,<3' 'shapely>=2.0,<3'
      - name: Download and validate complete commune footprint dataset
        run: python scripts/gis/import_valenciennes_city.py
      - name: Commit only after complete successful import
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/valenciennes/city_buildings.geojson data/valenciennes/commune_boundary.geojson
          if ! git diff --cached --quiet; then
            git commit -m "Update Valenciennes citywide OSM building footprints"
            git push
          fi
